    .resume-container {
      max-width: 800px;       
      margin: 1rem auto;      
      padding: 0 1rem;
    }

    .resume-terminal {
      background-color: #1e1e1e;
      border-radius: 6px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
      padding: 1rem 1rem 3rem 1rem;
      color: #cccccc;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.95rem;
      line-height: 1.3;
      overflow: hidden;      
      position: relative;    
    }

    #terminal-output {
      max-height: 450px;      
      overflow-y: auto;
      margin-bottom: 0.3rem;  
      white-space: pre-wrap;  
      word-break: break-word;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      position: absolute;
      left: 1rem;
      right: 1rem;
      bottom: 1rem;
      padding-top: 0.25rem;
      padding-bottom: 0.25rem;
      border-top: 1px solid #333; 
      background-color: #1e1e1e;  
    }

    .prompt-text {
      color: #00ff00;
      flex-shrink: 0;
      font-weight: bold;
    }

    .input-autocomplete-wrapper {
      position: relative;
      flex-grow: 1;
    }

    #cmd-input {
      background: transparent;
      border: none;
      outline: none;
      color: #00ff00;         
      font-family: inherit;
      font-size: inherit;
      width: 100%;
      caret-color: #00ff00;
    }

    .autocomplete-items {
      position: absolute;
      top: 100%;             
      left: 0;               
      right: 0;              
      background: #1e1e1e;    
      max-height: 140px;
      overflow-y: auto;
      z-index: 50;
      display: none;         
    }

    .autocomplete-items div {
      padding: 0.25rem 0.5rem;
      cursor: pointer;
      color: #cccccc;        
      white-space: nowrap;
    }

    .autocomplete-items div:hover,
    .autocomplete-active {
      background-color: #333; 
      color: #ffffff;
    }

    .cmd-echo {
      color: #00ff00;
      white-space: pre-wrap;
    }

    #terminal-output a {
      color: #00aeff;        
      text-decoration: underline;
    }
  </style>

      const outputDiv = document.getElementById("terminal-output");
      const inputField = document.getElementById("cmd-input");
      const autocompleteContainer = document.getElementById("autocomplete-list");

      const asciiArt =
      "  ____          _      _  _                              \n" +
      " / ___|   __ _ | |__  (_)| |_                             \n" +
      " \\___ \\  / _` || '_ \\ | || __|                            \n" +
      "  ___) || (_| || |_) || || |_                             \n" +
      " |____/  \\__,_||_.__/ |_| \\__|                            \n" +
      "  ____   _             _  _     _             _  _       \n" +
      " / ___| | |__    __ _ (_)| | __| |__    ___  | || |  __ _ \n" +
      " \\___ \\ | '_ \\  / _` || || |/ /| '_ \\  / _ \\ | || | / _` |\n" +
      "  ___) || | | || (_| || ||   < | | | || (_) || || || (_| |\n" +
      " |____/ |_| |_| \\__,_||_||_|\\_\\|_| |_| \\___/ |_||_| \\__,_|\n" +
      "                                                          \n";
      const welcomeMsg = 
      "Welcome to my resume CLI!\n" +
      "Type 'help' and press ↵ to see available commands.\n\n";

      outputDiv.innerHTML =
      "<div style=\"color: #ffffff; line-height:1; white-space: pre;\">" +
        asciiArt +
      "</div><br>" +
      "<div>" + welcomeMsg.replace(/\n/g, "<br>") + "</div>";

      let history = [];
      let historyIndex = 0;
      let currentFocus = -1;

      function formatOutput(text) {
        return text.replace(/\\n/g, "<br>");
      }

      function runCommand(cmd) {
        if (!cmd) return;

        const safeCmd = cmd
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
        outputDiv.innerHTML +=
          `<div>` +
            `<span class="prompt-text">sabit-shaikholla@resume:$ </span>` +
            `<span class="cmd-echo">${safeCmd}</span>` +
          `</div>`;

        if (commands[cmd]) {
          outputDiv.innerHTML +=
            `<div>${formatOutput(commands[cmd])}</div><br>`;
        } else {
          const errMsg = `Command not found. Type 'help' to list commands.`;
          outputDiv.innerHTML +=
            `<div>${formatOutput(errMsg)}</div><br>`;
        }

        outputDiv.scrollTop = outputDiv.scrollHeight;
      }

      function closeAutocomplete() {
        autocompleteContainer.style.display = "none";
        autocompleteContainer.innerHTML = "";
        currentFocus = -1;
      }

      function addActive(items) {
        if (!items) return;
        removeActive(items);
        if (currentFocus >= items.length) currentFocus = 0;
        if (currentFocus < 0) currentFocus = items.length - 1;
        items[currentFocus].classList.add("autocomplete-active");
      }

      function removeActive(items) {
        for (let i = 0; i < items.length; i++) {
          items[i].classList.remove("autocomplete-active");
        }
      }

      inputField.addEventListener("keydown", function(e) {
        const val = this.value;
        const list = autocompleteContainer.getElementsByTagName("div");

        if (e.key === "Tab") {
          if (list.length > 0) {
            if (currentFocus > -1) {
              this.value = list[currentFocus]
                .getElementsByTagName("input")[0].value;
            } else {
              this.value = list[0]
                .getElementsByTagName("input")[0].value;
            }
          }
          e.preventDefault();
          return;
        }

        if (e.key === "ArrowDown") {
          if (autocompleteContainer.style.display === "block" && list.length > 0) {
            currentFocus++;
            addActive(list);
            e.preventDefault();
          } else {
            if (history.length > 0) {
              historyIndex = Math.min(historyIndex + 1, history.length);
              this.value = history[historyIndex] || "";
            }
            e.preventDefault();
          }
          return;
        }

        if (e.key === "ArrowUp") {
          if (autocompleteContainer.style.display === "block" && list.length > 0) {
            currentFocus--;
            addActive(list);
            e.preventDefault();
          } else {
            if (history.length > 0) {
              historyIndex = Math.max(historyIndex - 1, 0);
              this.value = history[historyIndex];
            }
            e.preventDefault();
          }
          return;
        }

        if (e.key === "Enter") {
          e.preventDefault();
          const cmd = val.trim();
          if (cmd) {
            runCommand(cmd);
            history.push(cmd);
            historyIndex = history.length;
          }
          this.value = "";
          closeAutocomplete();
          return;
        }
      });

      inputField.addEventListener("input", function() {
        const val = this.value;
        closeAutocomplete();
        if (!val) return;

        currentFocus = -1;
        const valUpper = val.toUpperCase();

        for (const cmd of Object.keys(commands)) {
          if (cmd.toUpperCase().startsWith(valUpper)) {
            const itemDiv = document.createElement("div");
            itemDiv.innerHTML = "<strong>" + cmd.substr(0, val.length) + "</strong>";
            itemDiv.innerHTML += cmd.substr(val.length);
            itemDiv.innerHTML += `<input type='hidden' value='${cmd}'>`;

            itemDiv.addEventListener("click", function() {
              const fullCmd = this.getElementsByTagName("input")[0].value;
              inputField.value = fullCmd;
              closeAutocomplete();
            });

            autocompleteContainer.appendChild(itemDiv);
          }
        }

        if (autocompleteContainer.childElementCount > 0) {
          autocompleteContainer.style.display = "block";
        } else {
          autocompleteContainer.style.display = "none";
        }
      });

      document.addEventListener("click", function(e) {
        if (e.target !== inputField) {
          closeAutocomplete();
        }
      });
    })();
  </script>
